<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CapCut Web Studio Pro - Editor Completo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;700;900&family=Playfair+Display:wght@700&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background-color: #0d0d0f;
      color: #e4e4e7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      height: 100dvh;
      touch-action: manipulation;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #141417; }
    ::-webkit-scrollbar-thumb { background: #2e2e34; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00e5ff; }
    input[type="range"] {
      -webkit-appearance: none;
      background: #27272a;
      height: 5px;
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
    }
    .clip-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 14px;
      cursor: ew-resize;
      background: rgba(255, 255, 255, 0.3);
      opacity: 0;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .timeline-clip:hover .clip-handle,
    .timeline-clip.selected .clip-handle { opacity: 1; }
    .checkerboard {
      background-image: linear-gradient(45deg, #18181b 25%, transparent 25%),
                        linear-gradient(-45deg, #18181b 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #18181b 75%),
                        linear-gradient(-45deg, transparent 75%, #18181b 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex flex-col h-[100dvh]">

  <!-- TOP HEADER -->
  <header class="h-12 bg-[#141417] border-b border-[#27272a] flex items-center justify-between px-2.5 sm:px-4 shrink-0 z-30">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-[#00e5ff] to-[#3b82f6] flex items-center justify-center text-black font-black text-sm shrink-0">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <span class="font-bold text-xs sm:text-sm tracking-wide text-white truncate">CapCut <span class="text-[#00e5ff] font-normal">Pro Studio</span></span>
    </div>

    <div class="flex items-center gap-1.5 text-xs">
      <button onclick="undo()" title="Desfazer (Ctrl+Z)" class="p-2 rounded bg-[#1e1e22] hover:bg-[#2a2a30] text-zinc-300 transition">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button onclick="redo()" title="Refazer (Ctrl+Y)" class="p-2 rounded bg-[#1e1e22] hover:bg-[#2a2a30] text-zinc-300 transition">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button onclick="toggleKeyframeAtPlayhead()" title="Adicionar/Remover Keyframe ◇" class="px-2.5 py-1.5 rounded bg-[#1e1e22] hover:bg-[#2a2a30] text-[#00e5ff] border border-[#00e5ff]/30 flex items-center gap-1 transition">
        <i class="fa-solid fa-diamond text-[10px]"></i>
        <span class="hidden sm:inline text-[11px]">Keyframe</span>
      </button>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <label class="cursor-pointer bg-[#27272a] hover:bg-[#323238] text-white text-xs font-medium px-2.5 sm:px-3 py-1.5 rounded-md flex items-center gap-1.5 transition">
        <i class="fa-solid fa-plus text-[#00e5ff]"></i>
        <span class="hidden sm:inline">Importar</span>
        <input type="file" id="file-input" multiple accept="video/*,image/*,audio/*" class="hidden" />
      </label>
      <button id="btn-export" onclick="openExportModal()" class="bg-[#00e5ff] hover:bg-[#00cce6] text-black font-bold text-xs px-3 sm:px-4 py-1.5 rounded-md flex items-center gap-1.5 transition shadow-lg shadow-[#00e5ff]/20">
        <i class="fa-solid fa-arrow-up-from-bracket"></i>
        <span>Exportar</span>
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- DESKTOP LEFT SIDEBAR -->
    <aside class="hidden lg:flex w-80 bg-[#141417] border-r border-[#27272a] shrink-0">
      <div class="w-16 bg-[#101012] border-r border-[#27272a] flex flex-col items-center py-3 gap-3 shrink-0 overflow-y-auto no-scrollbar">
        <button onclick="switchTab('media')" data-tab="media" class="nav-tab flex flex-col items-center gap-1 text-[#00e5ff] text-[10px] font-medium">
          <div class="w-9 h-9 rounded-lg bg-[#00e5ff]/15 flex items-center justify-center text-base"><i class="fa-solid fa-photo-film"></i></div>
          Mídia
        </button>
        <button onclick="switchTab('audio')" data-tab="audio" class="nav-tab flex flex-col items-center gap-1 text-zinc-400 hover:text-white text-[10px] font-medium">
          <div class="w-9 h-9 rounded-lg hover:bg-[#1e1e22] flex items-center justify-center text-base"><i class="fa-solid fa-music"></i></div>
          Áudio
        </button>
        <button onclick="switchTab('text')" data-tab="text" class="nav-tab flex flex-col items-center gap-1 text-zinc-400 hover:text-white text-[10px] font-medium">
          <div class="w-9 h-9 rounded-lg hover:bg-[#1e1e22] flex items-center justify-center text-base"><i class="fa-solid fa-font"></i></div>
          Texto
        </button>
        <button onclick="switchTab('captions')" data-tab="captions" class="nav-tab flex flex-col items-center gap-1 text-zinc-400 hover:text-white text-[10px] font-medium">
          <div class="w-9 h-9 rounded-lg hover:bg-[#1e1e22] flex items-center justify-center text-base"><i class="fa-solid fa-closed-captioning"></i></div>
          Legendas
        </button>
        <button onclick="switchTab('stickers')" data-tab="stickers" class="nav-tab flex flex-col items-center gap-1 text-zinc-400 hover:text-white text-[10px] font-medium">
          <div class="w-9 h-9 rounded-lg hover:bg-[#1e1e22] flex items-center justify-center text-base"><i class="fa-solid fa-face-smile"></i></div>
          Stickers
        </button>
        <button onclick="switchTab('effects')" data-tab="effects" class="nav-tab flex flex-col items-center gap-1 text-zinc-400 hover:text-white text-[10px] font-medium">
          <div class="w-9 h-9 rounded-lg hover:bg-[#1e1e22] flex items-center justify-center text-base"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
          Filtros
        </button>
        <button onclick="switchTab('canvas')" data-tab="canvas" class="nav-tab flex flex-col items-center gap-1 text-zinc-400 hover:text-white text-[10px] font-medium">
          <div class="w-9 h-9 rounded-lg hover:bg-[#1e1e22] flex items-center justify-center text-base"><i class="fa-solid fa-fill-drip"></i></div>
          Fundo
        </button>
      </div>
      <div class="flex-1 p-3 overflow-y-auto" id="desktop-left-content"></div>
    </aside>

    <!-- CENTER: VIDEO PREVIEW PLAYER -->
    <main class="flex-1 bg-[#0a0a0c] flex flex-col items-center justify-between p-2 sm:p-3 relative overflow-hidden min-h-[200px]">
      <div class="w-full flex items-center justify-between text-xs text-zinc-400 px-1">
        <span class="text-[11px] font-medium text-zinc-400">Preview</span>
        <div class="flex items-center gap-1.5">
          <select id="aspect-ratio-select" onchange="changeAspectRatio(this.value)" class="bg-[#18181b] border border-[#27272a] rounded px-2 py-1 text-[11px] text-white outline-none">
            <option value="16:9">16:9 YouTube</option>
            <option value="9:16">9:16 TikTok/Reels</option>
            <option value="1:1">1:1 Quadrado</option>
            <option value="4:5">4:5 Feed IG</option>
          </select>
        </div>
      </div>

      <!-- Canvas Area -->
      <div id="canvas-stage" class="flex-1 w-full flex items-center justify-center overflow-hidden my-1.5">
        <div id="canvas-wrapper" class="relative shadow-2xl border border-[#27272a] checkerboard flex items-center justify-center max-w-full max-h-full">
          <canvas id="preview-canvas" width="960" height="540" class="block max-w-full max-h-full touch-none cursor-move"></canvas>
        </div>
      </div>

      <!-- Playback Controls -->
      <div class="w-full max-w-xl bg-[#141417] border border-[#27272a] rounded-lg px-3 py-1.5 flex items-center justify-between shrink-0">
        <div class="font-mono text-[11px] sm:text-xs">
          <span id="timecode-current" class="text-[#00e5ff] font-bold">00:00.00</span>
          <span class="text-zinc-500">/</span>
          <span id="timecode-total" class="text-zinc-400">00:15.00</span>
        </div>

        <div class="flex items-center gap-3 sm:gap-4">
          <button onclick="seekTo(0)" class="text-zinc-400 hover:text-white p-1.5 transition" title="Início">
            <i class="fa-solid fa-backward-step"></i>
          </button>
          <button id="btn-play-pause" onclick="togglePlay()" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white text-black hover:bg-[#00e5ff] flex items-center justify-center transition shadow">
            <i class="fa-solid fa-play ml-0.5 text-xs sm:text-sm"></i>
          </button>
          <button onclick="seekTo(project.duration)" class="text-zinc-400 hover:text-white p-1.5 transition" title="Fim">
            <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

        <div class="text-[10px] text-zinc-400 hidden sm:flex items-center gap-1.5">
          <i class="fa-solid fa-hand-pointer text-[#00e5ff]"></i> Arraste na tela
        </div>
      </div>
    </main>

    <!-- DESKTOP RIGHT SIDEBAR: ADVANCED INSPECTOR -->
    <aside class="hidden lg:flex w-80 bg-[#141417] border-l border-[#27272a] flex-col shrink-0">
      <div class="h-10 border-b border-[#27272a] px-3 flex items-center justify-between shrink-0">
        <span class="text-xs font-bold uppercase tracking-wider text-zinc-300">Configurações</span>
        <span id="inspector-badge" class="text-[10px] bg-[#27272a] px-2 py-0.5 rounded text-zinc-400">Nenhum</span>
      </div>
      <!-- Inspector Sub-Tabs -->
      <div id="inspector-subtabs" class="grid grid-cols-4 border-b border-[#27272a] bg-[#101012] text-[11px] font-medium shrink-0">
        <button onclick="setInspectorTab('basic')" data-itab="basic" class="itab-btn py-2 text-[#00e5ff] border-b-2 border-[#00e5ff]">Básico</button>
        <button onclick="setInspectorTab('color')" data-itab="color" class="itab-btn py-2 text-zinc-400 hover:text-white">Cor / Efeito</button>
        <button onclick="setInspectorTab('anim')" data-itab="anim" class="itab-btn py-2 text-zinc-400 hover:text-white">Animação</button>
        <button onclick="setInspectorTab('audio')" data-itab="audio" class="itab-btn py-2 text-zinc-400 hover:text-white">Áudio</button>
      </div>
      <div id="desktop-inspector-content" class="flex-1 p-3.5 overflow-y-auto space-y-3 text-xs"></div>
    </aside>

    <!-- MOBILE SLIDE-UP DRAWER -->
    <div id="mobile-drawer" class="lg:hidden fixed inset-x-0 bottom-14 bg-[#16161a] border-t border-[#2e2e36] rounded-t-2xl shadow-2xl z-40 transform translate-y-full transition-transform duration-200 max-h-[58dvh] flex flex-col">
      <div class="h-10 px-4 border-b border-[#27272a] flex items-center justify-between shrink-0">
        <span id="mobile-drawer-title" class="text-xs font-bold text-white uppercase tracking-wider">Ferramentas</span>
        <button onclick="closeMobileDrawer()" class="w-7 h-7 rounded-full bg-[#27272a] text-zinc-300 flex items-center justify-center">
          <i class="fa-solid fa-chevron-down text-xs"></i>
        </button>
      </div>
      <div id="mobile-inspector-subtabs" class="hidden grid-cols-4 border-b border-[#27272a] bg-[#101012] text-[11px] font-medium shrink-0">
        <button onclick="setInspectorTab('basic')" data-itab="basic" class="itab-btn py-2 text-[#00e5ff] border-b-2 border-[#00e5ff]">Básico</button>
        <button onclick="setInspectorTab('color')" data-itab="color" class="itab-btn py-2 text-zinc-400">Cor / Efeito</button>
        <button onclick="setInspectorTab('anim')" data-itab="anim" class="itab-btn py-2 text-zinc-400">Animação</button>
        <button onclick="setInspectorTab('audio')" data-itab="audio" class="itab-btn py-2 text-zinc-400">Áudio</button>
      </div>
      <div id="mobile-drawer-content" class="flex-1 p-3.5 overflow-y-auto text-xs"></div>
    </div>
  </div>

  <!-- MULTI-TRACK TIMELINE -->
  <section class="h-44 sm:h-52 lg:h-60 bg-[#121215] border-t border-[#27272a] flex flex-col shrink-0">
    <!-- Timeline Toolbar -->
    <div class="h-9 bg-[#16161a] border-b border-[#27272a] px-2.5 sm:px-4 flex items-center justify-between text-xs shrink-0">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
        <button onclick="splitSelectedClip()" class="px-2 py-1 rounded bg-[#222227] hover:bg-[#2e2e35] text-zinc-200 flex items-center gap-1 transition shrink-0">
          <i class="fa-solid fa-scissors text-[#00e5ff]"></i> <span>Dividir</span>
        </button>
        <button onclick="duplicateSelectedClip()" class="px-2 py-1 rounded bg-[#222227] hover:bg-[#2e2e35] text-zinc-200 flex items-center gap-1 transition shrink-0">
          <i class="fa-regular fa-copy"></i> <span class="hidden sm:inline">Duplicar</span>
        </button>
        <button onclick="extractAudioFromSelected()" class="px-2 py-1 rounded bg-[#222227] hover:bg-[#2e2e35] text-zinc-200 flex items-center gap-1 transition shrink-0" title="Separar áudio para trilha própria">
          <i class="fa-solid fa-wave-square text-emerald-400"></i> <span class="hidden md:inline">Extrair Áudio</span>
        </button>
        <button onclick="deleteSelectedClip()" class="px-2 py-1 rounded bg-[#222227] hover:bg-red-500/20 hover:text-red-400 text-zinc-200 flex items-center gap-1 transition shrink-0">
          <i class="fa-regular fa-trash-can"></i> <span class="hidden sm:inline">Excluir</span>
        </button>
        <button onclick="openMobileInspector()" class="lg:hidden px-2.5 py-1 rounded bg-[#00e5ff]/15 border border-[#00e5ff]/40 text-[#00e5ff] font-medium flex items-center gap-1 transition shrink-0">
          <i class="fa-solid fa-sliders"></i> Configurar Clipe
        </button>
      </div>

      <div class="flex items-center gap-1.5 shrink-0 ml-2">
        <i class="fa-solid fa-magnifying-glass-minus text-zinc-400 text-[10px]"></i>
        <input type="range" id="timeline-zoom" min="25" max="140" value="55" oninput="setTimelineZoom(this.value)" class="w-16 sm:w-28" />
        <i class="fa-solid fa-magnifying-glass-plus text-zinc-400 text-[10px]"></i>
      </div>
    </div>

    <!-- Timeline Tracks Container -->
    <div class="flex-1 flex overflow-hidden relative">
      <div class="w-11 sm:w-32 bg-[#141417] border-r border-[#27272a] flex flex-col shrink-0 z-10">
        <div class="h-6 border-b border-[#27272a] bg-[#101012]"></div>
        <div class="flex-1 border-b border-[#27272a] px-2 flex items-center justify-center sm:justify-start gap-2 text-xs text-zinc-300">
          <i class="fa-solid fa-layer-group text-purple-400"></i>
          <span class="hidden sm:inline truncate">Texto / Camada</span>
        </div>
        <div class="flex-1 border-b border-[#27272a] px-2 flex items-center justify-center sm:justify-start gap-2 text-xs text-zinc-300">
          <i class="fa-solid fa-film text-[#00e5ff]"></i>
          <span class="hidden sm:inline truncate">Vídeo Principal</span>
        </div>
        <div class="flex-1 border-b border-[#27272a] px-2 flex items-center justify-center sm:justify-start gap-2 text-xs text-zinc-300">
          <i class="fa-solid fa-volume-high text-emerald-400"></i>
          <span class="hidden sm:inline truncate">Áudio</span>
        </div>
      </div>

      <div id="timeline-scroll" class="flex-1 overflow-x-auto overflow-y-hidden relative bg-[#0e0e11]">
        <div id="timeline-inner" class="relative h-full flex flex-col" style="width: 1500px;">
          <div id="timeline-ruler" class="h-6 border-b border-[#27272a] bg-[#141417] relative cursor-pointer shrink-0 touch-none"></div>
          <div id="track-overlay" class="flex-1 border-b border-[#1f1f24] relative"></div>
          <div id="track-video" class="flex-1 border-b border-[#1f1f24] relative bg-[#121216]"></div>
          <div id="track-audio" class="flex-1 border-b border-[#1f1f24] relative"></div>

          <div id="playhead" class="absolute top-0 bottom-0 w-[2px] bg-[#00e5ff] z-20 pointer-events-none" style="left: 0px;">
            <div class="w-3.5 h-3.5 bg-[#00e5ff] rotate-45 -ml-[6px] -mt-1.5 rounded-xs shadow"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <nav class="lg:hidden h-14 bg-[#101012] border-t border-[#27272a] flex items-center justify-around px-1 shrink-0 z-50 overflow-x-auto no-scrollbar">
    <button onclick="openMobileTab('media', 'Biblioteca de Mídia')" class="flex flex-col items-center justify-center gap-0.5 text-zinc-300 text-[10px] py-1 px-2 shrink-0">
      <i class="fa-solid fa-photo-film text-base text-[#00e5ff]"></i><span>Mídia</span>
    </button>
    <button onclick="openMobileTab('audio', 'Áudio e Trilhas')" class="flex flex-col items-center justify-center gap-0.5 text-zinc-300 text-[10px] py-1 px-2 shrink-0">
      <i class="fa-solid fa-music text-base text-emerald-400"></i><span>Áudio</span>
    </button>
    <button onclick="openMobileTab('text', 'Adicionar Texto')" class="flex flex-col items-center justify-center gap-0.5 text-zinc-300 text-[10px] py-1 px-2 shrink-0">
      <i class="fa-solid fa-font text-base text-purple-400"></i><span>Texto</span>
    </button>
    <button onclick="openMobileTab('captions', 'Legendas Automáticas')" class="flex flex-col items-center justify-center gap-0.5 text-zinc-300 text-[10px] py-1 px-2 shrink-0">
      <i class="fa-solid fa-closed-captioning text-base text-amber-400"></i><span>Legendas</span>
    </button>
    <button onclick="openMobileTab('stickers', 'Stickers & Emojis')" class="flex flex-col items-center justify-center gap-0.5 text-zinc-300 text-[10px] py-1 px-2 shrink-0">
      <i class="fa-solid fa-face-smile text-base text-pink-400"></i><span>Stickers</span>
    </button>
    <button onclick="openMobileTab('effects', 'Filtros de Vídeo')" class="flex flex-col items-center justify-center gap-0.5 text-zinc-300 text-[10px] py-1 px-2 shrink-0">
      <i class="fa-solid fa-wand-magic-sparkles text-base text-cyan-400"></i><span>Filtros</span>
    </button>
    <button onclick="openMobileTab('canvas', 'Fundo da Tela')" class="flex flex-col items-center justify-center gap-0.5 text-zinc-300 text-[10px] py-1 px-2 shrink-0">
      <i class="fa-solid fa-fill-drip text-base text-indigo-400"></i><span>Fundo</span>
    </button>
  </nav>

  <!-- EXPORT MODAL -->
  <div id="export-modal" class="fixed inset-0 bg-black/80 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-[#18181b] border border-[#27272a] rounded-xl w-full max-w-sm p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-white flex items-center gap-2 text-sm">
          <i class="fa-solid fa-clapperboard text-[#00e5ff]"></i> Exportar Vídeo
        </h3>
        <button onclick="closeExportModal()" class="text-zinc-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-zinc-400 mb-1">Nome do Arquivo</label>
          <input type="text" id="export-filename" value="meu_video_capcut" class="w-full bg-[#101012] border border-[#27272a] rounded px-3 py-2 text-white outline-none focus:border-[#00e5ff]" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-zinc-400 mb-1">Formato</label>
            <select id="export-format" class="w-full bg-[#101012] border border-[#27272a] rounded px-2 py-2 text-white outline-none">
              <option value="mp4">MP4 (FFmpeg H.264)</option>
              <option value="webm">WebM (Rápido)</option>
            </select>
          </div>
          <div>
            <label class="block text-zinc-400 mb-1">FPS</label>
            <select id="export-fps" class="w-full bg-[#101012] border border-[#27272a] rounded px-2 py-2 text-white outline-none">
              <option value="30">30 FPS</option>
              <option value="60">60 FPS</option>
            </select>
          </div>
        </div>

        <div id="export-progress-box" class="hidden pt-2">
          <div class="flex justify-between text-[11px] mb-1">
            <span id="export-stage" class="text-[#00e5ff]">Capturando quadros...</span>
            <span id="export-pct">0%</span>
          </div>
          <div class="w-full h-2 bg-[#101012] rounded-full overflow-hidden">
            <div id="export-bar" class="h-full bg-[#00e5ff] transition-all duration-100" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <div class="mt-5 flex justify-end gap-2">
        <button onclick="closeExportModal()" class="px-4 py-2 rounded bg-[#27272a] text-xs text-zinc-300 hover:bg-[#323238]">Cancelar</button>
        <button id="btn-start-render" onclick="startVideoExport()" class="px-4 py-2 rounded bg-[#00e5ff] text-black font-bold text-xs hover:bg-[#00cce6]">
          Exportar Agora
        </button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================

    function fitCanvasToStage() {
      const stage = document.getElementById('canvas-stage');
      const wrapper = document.getElementById('canvas-wrapper');
      if (!stage || !wrapper) return;

      const maxW = stage.clientWidth - 8;
      const maxH = stage.clientHeight - 8;
      const ratio = canvas.width / canvas.height;

      let w = maxW;
      let h = w / ratio;
      if (h > maxH) {
        h = maxH;
        w = h * ratio;
      }
      wrapper.style.width = `${Math.max(120, Math.floor(w))}px`;
      wrapper.style.height = `${Math.max(120, Math.floor(h))}px`;
    }

    function createSyntheticVideo(style, durationSec) {
      return new Promise((resolve) => {
        const offCanvas = document.createElement('canvas');
        offCanvas.width = 640;
        offCanvas.height = 360;
        const octx = offCanvas.getContext('2d');
        const stream = offCanvas.captureStream(30);
        const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        const chunks = [];

        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => resolve(URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })));

        recorder.start();
        let frame = 0;
        const totalFrames = durationSec * 30;

        const interval = setInterval(() => {
          const t = frame / 30;
          if (style === 'neon') {
            const grad = octx.createLinearGradient(0, 0, 640, 360);
            grad.addColorStop(0, `hsl(${(t * 60) % 360}, 70%, 18%)`);
            grad.addColorStop(1, `hsl(${(t * 60 + 120) % 360}, 80%, 10%)`);
            octx.fillStyle = grad;
            octx.fillRect(0, 0, 640, 360);

            for (let i = 0; i < 6; i++) {
              octx.beginPath();
              octx.arc(320 + Math.cos(t * 2 + i) * 140, 180 + Math.sin(t * 3 + i) * 80, 25 + i * 6, 0, Math.PI * 2);
              octx.strokeStyle = 'rgba(0, 229, 255, 0.5)';
              octx.lineWidth = 3;
              octx.stroke();
            }
          } else {
            octx.fillStyle = '#00ff00';
            octx.fillRect(0, 0, 640, 360);
            octx.save();
            octx.translate(320 + Math.sin(t * 3) * 120, 180);
            octx.rotate(t * 2);
            octx.fillStyle = '#ff2a5f';
            octx.fillRect(-55, -55, 110, 110);
            octx.fillStyle = '#ffffff';
            octx.font = 'bold 20px sans-serif';
            octx.textAlign = 'center';
            octx.fillText('LIVE', 0, 7);
            octx.restore();
          }

          frame++;
          if (frame >= totalFrames) {
            clearInterval(interval);
            recorder.stop();
          }
        }, 1000 / 30);
      });
    }

    function createSyntheticAudioWav(durationSec) {
      const sampleRate = 22050;
      const numSamples = sampleRate * durationSec;
      const buffer = new ArrayBuffer(44 + numSamples * 2);
      const view = new DataView(buffer);
      const writeString = (offset, str) => {
        for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
      };
      writeString(0, 'RIFF');
      view.setUint32(4, 36 + numSamples * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, numSamples * 2, true);

      const notes = [261.63, 329.63, 392.00, 523.25];
      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const beat = Math.floor(t * 4);
        const freq = notes[beat % notes.length];
        const env = Math.exp(-(t * 4 - beat) * 4);
        const sample = Math.sin(2 * Math.PI * freq * t) * env * 0.35;
        view.setInt16(44 + i * 2, sample * 32767, true);
      }
      return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
    }

    function loadVideoElement(url) {
      return new Promise((resolve) => {
        const v = document.createElement('video');
        v.src = url;
        v.muted = true;
        v.playsInline = true;
        v.preload = 'auto';
        v.onloadedmetadata = () => resolve(v);
      });
    }

    // ==========================================
    // KEYFRAMES (QUADROS-CHAVE ◇)
    // ==========================================
    function toggleKeyframeAtPlayhead() {
      const clip = getSelectedClip();
      if (!clip || clip.type === 'audio') {
        alert('Selecione um clipe de vídeo, imagem ou texto na timeline para marcar Keyframes.');
        return;
      }
      const localT = Number((project.currentTime - clip.startTime).toFixed(2));
      if (localT < 0 || localT > clip.duration) {
        alert('Posicione a agulha azul dentro do clipe selecionado.');
        return;
      }

      if (!clip.keyframes) clip.keyframes = [];
      const existingIdx = clip.keyframes.findIndex((k) => Math.abs(k.time - localT) < 0.15);

      if (existingIdx >= 0) {
        clip.keyframes.splice(existingIdx, 1);
      } else {
        clip.keyframes.push({
          time: localT,
          x: clip.x,
          y: clip.y,
          scale: clip.scale,
          rotation: clip.rotation,
          opacity: clip.opacity
        });
        clip.keyframes.sort((a, b) => a.time - b.time);
      }
      saveState();
      renderTimeline();
      renderInspector();
    }

    function getInterpolatedTransform(clip, localTime) {
      if (!clip.keyframes || clip.keyframes.length === 0) {
        return { x: clip.x, y: clip.y, scale: clip.scale, rotation: clip.rotation, opacity: clip.opacity };
      }
      const kfs = clip.keyframes;
      if (localTime <= kfs[0].time) return { ...kfs[0] };
      if (localTime >= kfs[kfs.length - 1].time) return { ...kfs[kfs.length - 1] };

      for (let i = 0; i < kfs.length - 1; i++) {
        if (localTime >= kfs[i].time && localTime <= kfs[i + 1].time) {
          const span = kfs[i + 1].time - kfs[i].time || 0.001;
          const p = (localTime - kfs[i].time) / span;
          const lerp = (a, b) => a + (b - a) * p;
          return {
            x: lerp(kfs[i].x, kfs[i + 1].x),
            y: lerp(kfs[i].y, kfs[i + 1].y),
            scale: lerp(kfs[i].scale, kfs[i + 1].scale),
            rotation: lerp(kfs[i].rotation, kfs[i + 1].rotation),
            opacity: lerp(kfs[i].opacity, kfs[i + 1].opacity)
          };
        }
      }
      return { x: clip.x, y: clip.y, scale: clip.scale, rotation: clip.rotation, opacity: clip.opacity };
    }

    // ==========================================
    // LEGENDAS AUTOMÁTICAS POR VOZ
    // ==========================================
    function toggleAutoCaptions() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('Seu navegador não suporta reconhecimento de voz nativo. Use o Chrome ou Edge.');
        return;
      }

      if (isRecordingCaptions) {
        isRecordingCaptions = false;
        if (recognition) recognition.stop();
        if (project.isPlaying) togglePlay();
        switchTab('captions');
        return;
      }

      const lang = document.getElementById('caption-lang')?.value || 'pt-BR';
      const stylePreset = document.getElementById('caption-style')?.value || 'tiktok';

      recognition = new SpeechRecognition();
      recognition.lang = lang;
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecordingCaptions = true;
        captionStartTime = project.currentTime;
        liveInterimText = '';
        if (!project.isPlaying) togglePlay();
        switchTab('captions');
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.trim();
          if (event.results[i].isFinal) {
            const endTime = project.currentTime;
            const duration = Math.max(1.2, endTime - captionStartTime);
            const styles = {
              tiktok: { fontSize: 38, color: '#000000', bgColor: '#fde047', hasBg: true, y: 0.82 },
              neon: { fontSize: 38, color: '#ffffff', bgColor: '#00e5ff', hasBg: true, y: 0.82 },
              classic: { fontSize: 34, color: '#ffffff', bgColor: '#000000', hasBg: true, y: 0.85 }
            };
            addTextClip(transcript.toUpperCase(), captionStartTime, duration, styles[stylePreset]);
            captionStartTime = endTime;
            liveInterimText = '';
          } else {
            interim += transcript;
            liveInterimText = interim;
          }
        }
        document.querySelectorAll('.live-transcript-box').forEach((box) => {
          box.textContent = liveInterimText || 'Ouvindo sua voz...';
        });
      };

      recognition.onerror = () => {
        isRecordingCaptions = false;
        switchTab('captions');
      };

      recognition.onend = () => {
        if (isRecordingCaptions) {
          try { recognition.start(); } catch (e) {}
        }
      };

      recognition.start();
    }

    function generateScriptCaptions(btnEl) {
      const container = btnEl.parentElement;
      const textarea = container.querySelector('.manual-script-input');
      const rawText = textarea.value.trim();
      if (!rawText) return;
      const sentences = rawText.split(/[\n.!?]+/).map((s) => s.trim()).filter(Boolean);
      let cursor = project.currentTime;
      sentences.forEach((sentence) => {
        const dur = Math.max(1.5, Math.min(4.5, sentence.length * 0.08));
        addTextClip(sentence.toUpperCase(), cursor, dur, {
          fontSize: 36,
          color: '#000000',
          bgColor: '#fde047',
          hasBg: true,
          y: 0.82
        });
        cursor += dur + 0.1;
      });
      textarea.value = '';
      closeMobileDrawer();
    }

    // ==========================================
    // GERENCIAMENTO DE CLIPES E TIMELINE
    // ==========================================
    function addMediaById(mediaId) {
      const media = project.mediaLibrary.find((m) => m.id === mediaId);
      if (!media) return;
      addClipFromMedia(media, project.currentTime);
      saveState();
      renderTimeline();
    }

    function addClipFromMedia(media, startTime) {
      const track = media.type === 'audio' ? 'audio' : (media.type === 'image' ? 'overlay' : 'video');
      const clip = {
        id: 'clip-' + Date.now() + Math.random().toString(36).substr(2, 5),
        mediaId: media.id,
        name: media.name,
        type: media.type,
        track,
        startTime,
        duration: media.duration,
        offset: 0,
        speed: 1,
        volume: 1,
        muted: false,
        fadeInAudio: 0,
        fadeOutAudio: 0,
        x: 0.5,
        y: 0.5,
        scale: 1,
        rotation: 0,
        flipH: false,
        flipV: false,
        borderRadius: 0,
        vignette: 0,
        blendMode: 'source-over',
        opacity: 1,
        brightness: 100,
        contrast: 100,
        saturate: 100,
        hue: 0,
        sepia: 0,
        invert: 0,
        blur: 0,
        chromaKey: false,
        chromaColor: '#00ff00',
        chromaTolerance: 95,
        animIn: 'none',
        animOut: 'none',
        keyframes: []
      };
      project.clips.push(clip);
      selectClip(clip.id);
      updateProjectDuration();
    }

    function addTextClip(text, startTime, duration, style = {}) {
      const clip = {
        id: 'clip-' + Date.now() + Math.random().toString(36).substr(2, 5),
        name: text.substring(0, 18),
        type: 'text',
        track: 'overlay',
        text,
        startTime,
        duration,
        x: style.x ?? 0.5,
        y: style.y ?? 0.5,
        scale: 1,
        rotation: 0,
        flipH: false,
        flipV: false,
        blendMode: 'source-over',
        opacity: 1,
        fontSize: style.fontSize || 42,
        fontFamily: style.fontFamily || 'Inter',
        color: style.color || '#ffffff',
        strokeColor: '#000000',
        strokeWidth: 0,
        shadowBlur: 0,
        bgColor: style.bgColor || '#000000',
        hasBg: style.hasBg ?? false,
        animIn: 'fade',
        animOut: 'none',
        keyframes: []
      };
      project.clips.push(clip);
      selectClip(clip.id);
      updateProjectDuration();
      saveState();
      renderTimeline();
    }

    function extractAudioFromSelected() {
      const clip = getSelectedClip();
      if (!clip || clip.type !== 'video') {
        alert('Selecione um clipe de vídeo na timeline para extrair o áudio.');
        return;
      }
      const audioClip = {
        id: 'clip-aud-' + Date.now(),
        mediaId: clip.mediaId,
        name: 'Áudio: ' + clip.name,
        type: 'audio',
        track: 'audio',
        startTime: clip.startTime,
        duration: clip.duration,
        offset: clip.offset || 0,
        speed: clip.speed || 1,
        volume: clip.volume ?? 1,
        muted: false,
        fadeInAudio: 0,
        fadeOutAudio: 0
      };
      clip.muted = true;
      project.clips.push(audioClip);
      selectClip(audioClip.id);
      saveState();
      renderTimeline();
    }

    function updateProjectDuration() {
      let maxEnd = 10;
      project.clips.forEach((c) => {
        if (c.startTime + c.duration > maxEnd) maxEnd = c.startTime + c.duration;
      });
      project.duration = Math.ceil(maxEnd + 2);
      document.getElementById('timecode-total').textContent = formatTime(project.duration);
    }

    function selectClip(id) {
      project.selectedClipId = id;
      renderTimeline();
      renderInspector();
    }

    function getSelectedClip() {
      return project.clips.find((c) => c.id === project.selectedClipId);
    }

    function splitSelectedClip() {
      const clip = getSelectedClip();
      if (!clip) return;
      const t = project.currentTime;
      if (t <= clip.startTime + 0.1 || t >= clip.startTime + clip.duration - 0.1) return;

      const firstDur = t - clip.startTime;
      const secondDur = clip.duration - firstDur;

      const secondClip = JSON.parse(JSON.stringify(clip));
      secondClip.id = 'clip-' + Date.now();
      secondClip.startTime = t;
      secondClip.duration = secondDur;
      secondClip.keyframes = [];
      if (secondClip.offset !== undefined) secondClip.offset += firstDur * (clip.speed || 1);

      clip.duration = firstDur;
      project.clips.push(secondClip);
      selectClip(secondClip.id);
      saveState();
      renderTimeline();
    }

    function duplicateSelectedClip() {
      const clip = getSelectedClip();
      if (!clip) return;
      const copy = JSON.parse(JSON.stringify(clip));
      copy.id = 'clip-' + Date.now();
      copy.startTime = clip.startTime + clip.duration;
      project.clips.push(copy);
      selectClip(copy.id);
      updateProjectDuration();
      saveState();
      renderTimeline();
    }

    function deleteSelectedClip() {
      if (!project.selectedClipId) return;
      project.clips = project.clips.filter((c) => c.id !== project.selectedClipId);
      project.selectedClipId = null;
      saveState();
      renderTimeline();
      renderInspector();
    }

    function applyFilterPreset(preset) {
      const clip = getSelectedClip();
      if (!clip || (clip.type !== 'video' && clip.type !== 'image')) {
        alert('Selecione primeiro um clipe de vídeo ou imagem na timeline!');
        return;
      }
      Object.assign(clip, preset);
      saveState();
      renderInspector();
    }

    // ==========================================
    // RENDERIZAÇÃO DA TIMELINE (COM KEYFRAMES ◇)
    // ==========================================
    function renderTimeline() {
      const inner = document.getElementById('timeline-inner');
      inner.style.width = `${Math.max(900, project.duration * project.zoom + 160)}px`;

      const ruler = document.getElementById('timeline-ruler');
      ruler.innerHTML = '';
      for (let s = 0; s <= project.duration; s++) {
        const tick = document.createElement('div');
        tick.className = 'absolute top-0 bottom-0 border-l border-zinc-700 text-[9px] text-zinc-400 pl-1 pt-0.5';
        tick.style.left = `${s * project.zoom}px`;
        tick.textContent = `${s}s`;
        ruler.appendChild(tick);
      }

      ['overlay', 'video', 'audio'].forEach((t) => {
        document.getElementById(`track-${t}`).innerHTML = '';
      });

      project.clips.forEach((clip) => {
        const trackEl = document.getElementById(`track-${clip.track}`);
        if (!trackEl) return;

        const el = document.createElement('div');
        const isSelected = clip.id === project.selectedClipId;
        const colors = {
          video: 'bg-[#0e4f5c] border-[#00e5ff]',
          overlay: 'bg-[#3b1d5e] border-purple-400',
          audio: 'bg-[#124734] border-emerald-400'
        };

        el.className = `timeline-clip absolute top-1 bottom-1 rounded-md border ${colors[clip.track]} ${isSelected ? 'ring-2 ring-white selected z-10' : 'opacity-90'} px-2 flex items-center overflow-hidden cursor-grab touch-none`;
        el.style.left = `${clip.startTime * project.zoom}px`;
        el.style.width = `${Math.max(24, clip.duration * project.zoom)}px`;

        const kfMarkers = (clip.keyframes || []).map((kf) =>
          `<div class="absolute bottom-1 w-2 h-2 bg-amber-400 rotate-45 pointer-events-none" style="left:${kf.time * project.zoom}px" title="Keyframe ${kf.time}s"></div>`
        ).join('');

        el.innerHTML = `
          <div class="clip-handle left-0" data-action="trim-left"><div class="w-0.5 h-3 bg-white"></div></div>
          <span class="text-[10px] sm:text-[11px] font-medium text-white truncate pointer-events-none">${clip.muted ? '🔇 ' : ''}${clip.name}</span>
          ${kfMarkers}
          <div class="clip-handle right-0" data-action="trim-right"><div class="w-0.5 h-3 bg-white"></div></div>
        `;

        const startDrag = (e) => {
          e.stopPropagation();
          selectClip(clip.id);
          const action = e.target.dataset.action || 'move';
          const { clientX: startX } = getClientCoords(e);
          const origStart = clip.startTime;
          const origDur = clip.duration;

          const onMove = (mv) => {
            if (mv.cancelable) mv.preventDefault();
            const { clientX } = getClientCoords(mv);
            const dx = (clientX - startX) / project.zoom;
            if (action === 'move') {
              clip.startTime = Math.max(0, origStart + dx);
            } else if (action === 'trim-right') {
              clip.duration = Math.max(0.3, origDur + dx);
            } else if (action === 'trim-left') {
              const newStart = Math.max(0, Math.min(origStart + origDur - 0.3, origStart + dx));
              clip.duration = origDur - (newStart - origStart);
              clip.startTime = newStart;
            }
            updateProjectDuration();
            renderTimeline();
          };

          const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            window.removeEventListener('touchmove', onMove);
            window.removeEventListener('touchend', onUp);
            saveState();
          };

          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
          window.addEventListener('touchmove', onMove, { passive: false });
          window.addEventListener('touchend', onUp);
        };

        el.addEventListener('mousedown', startDrag);
        el.addEventListener('touchstart', startDrag, { passive: false });
        trackEl.appendChild(el);
      });

      updatePlayheadUI();
    }

    const handleRulerSeek = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const updateNeedle = (ev) => {
        if (ev.cancelable) ev.preventDefault();
        const { clientX } = getClientCoords(ev);
        const x = Math.max(0, clientX - rect.left);
        seekTo(Math.min(project.duration, x / project.zoom));
      };
      updateNeedle(e);
      const onUp = () => {
        window.removeEventListener('mousemove', updateNeedle);
        window.removeEventListener('mouseup', onUp);
        window.removeEventListener('touchmove', updateNeedle);
        window.removeEventListener('touchend', onUp);
      };
      window.addEventListener('mousemove', updateNeedle);
      window.addEventListener('mouseup', onUp);
      window.addEventListener('touchmove', updateNeedle, { passive: false });
      window.addEventListener('touchend', onUp);
    };

    const rulerEl = document.getElementById('timeline-ruler');
    rulerEl.addEventListener('mousedown', handleRulerSeek);
    rulerEl.addEventListener('touchstart', handleRulerSeek, { passive: false });

    function setTimelineZoom(val) {
      project.zoom = Number(val);
      renderTimeline();
    }

    function updatePlayheadUI() {
      document.getElementById('playhead').style.left = `${project.currentTime * project.zoom}px`;
      document.getElementById('timecode-current').textContent = formatTime(project.currentTime);
    }

                  <option value="zoom" ${clip.animIn === 'zoom' ? 'selected' : ''}>Zoom In</option>
                  <option value="slideUp" ${clip.animIn === 'slideUp' ? 'selected' : ''}>Deslizar para Cima</option>
                </select>
              </div>
              <div>
                <label class="text-zinc-400 block mb-1">Animação de Saída (Out)</label>
                <select onchange="updateClipProp('animOut', this.value)" class="w-full bg-[#101012] border border-[#27272a] rounded px-2 py-1.5 text-white outline-none">
                  <option value="none" ${clip.animOut === 'none' ? 'selected' : ''}>Nenhuma</option>
                  <option value="fade" ${clip.animOut === 'fade' ? 'selected' : ''}>Fade Out (Desaparecer)</option>
                  <option value="zoomOut" ${clip.animOut === 'zoomOut' ? 'selected' : ''}>Zoom Out</option>
                </select>
              </div>
            </div>

            <div class="bg-[#1b1b20] p-3 rounded-lg border border-[#27272a] space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="font-bold text-zinc-200">Keyframes ◇ (${(clip.keyframes || []).length})</span>
                <button onclick="toggleKeyframeAtPlayhead()" class="px-2 py-1 rounded bg-[#00e5ff] text-black font-bold text-[10px]">+ Marcar Agora</button>
              </div>
              <p class="text-[11px] text-zinc-400">Mova a agulha na timeline, altere posição ou escala e marque Keyframes para animar.</p>
              <div class="space-y-1 max-h-28 overflow-y-auto">
                ${(clip.keyframes || []).map((kf, idx) => `
                  <div class="flex items-center justify-between bg-[#101012] px-2 py-1 rounded text-[11px]">
                    <span class="text-amber-400">◇ ${kf.time}s (Escala ${Math.round(kf.scale * 100)}%)</span>
                    <button onclick="getSelectedClip().keyframes.splice(${idx},1); renderTimeline(); renderInspector();" class="text-red-400"><i class="fa-solid fa-xmark"></i></button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else if (activeInspectorTab === 'audio') {
          if (clip.type === 'video' || clip.type === 'audio') {
            html = `
              <div class="bg-[#1b1b20] p-3 rounded-lg border border-[#27272a] space-y-2.5">
                <div class="flex items-center justify-between">
                  <span class="font-bold text-zinc-200">Controle de Áudio & Velocidade</span>
                  <button onclick="updateClipProp('muted', !getSelectedClip().muted); renderTimeline();" class="px-2 py-1 rounded ${clip.muted ? 'bg-red-500 text-white' : 'bg-[#27272a] text-zinc-300'} text-[10px]">
                    ${clip.muted ? '🔇 Mudo' : '🔊 Ativo'}
                  </button>
                </div>
                <div>
                  <div class="flex justify-between text-zinc-400 mb-1"><span>Volume</span><span>${Math.round(clip.volume * 100)}%</span></div>
                  <input type="range" min="0" max="1" step="0.05" value="${clip.volume}" oninput="updateClipProp('volume', parseFloat(this.value))" class="w-full" />
                </div>
                <div>
                  <div class="flex justify-between text-zinc-400 mb-1"><span>Velocidade (Speed)</span><span>${clip.speed}x</span></div>
                  <input type="range" min="0.25" max="3.0" step="0.25" value="${clip.speed}" oninput="updateClipProp('speed', parseFloat(this.value))" class="w-full" />
                </div>
                <div>
                  <div class="flex justify-between text-zinc-400 mb-1"><span>Fade In Áudio</span><span>${clip.fadeInAudio || 0}s</span></div>
                  <input type="range" min="0" max="3" step="0.2" value="${clip.fadeInAudio || 0}" oninput="updateClipProp('fadeInAudio', parseFloat(this.value))" class="w-full" />
                </div>
                <div>
                  <div class="flex justify-between text-zinc-400 mb-1"><span>Fade Out Áudio</span><span>${clip.fadeOutAudio || 0}s</span></div>
                  <input type="range" min="0" max="3" step="0.2" value="${clip.fadeOutAudio || 0}" oninput="updateClipProp('fadeOutAudio', parseFloat(this.value))" class="w-full" />
                </div>
              </div>
            `;
          } else {
            html = `<div class="text-center text-zinc-500 py-8">Controles de áudio disponíveis apenas para vídeo e música.</div>`;
          }
        }
      }

      const desktopInsp = document.getElementById('desktop-inspector-content');
      const mobileDrawer = document.getElementById('mobile-drawer-content');
      if (desktopInsp) desktopInsp.innerHTML = html;
      if (mobileDrawer && !document.getElementById('mobile-inspector-subtabs').classList.contains('hidden')) {
        mobileDrawer.innerHTML = html;
      }
    }

    function updateClipProp(prop, value) {
      const clip = getSelectedClip();
      if (!clip) return;
      clip[prop] = value;
      if (prop === 'text') {
        clip.name = value.substring(0, 18);
        renderTimeline();
      }
      renderInspector();
    }

    function resetTransform() {
      const clip = getSelectedClip();
      if (!clip) return;
      clip.x = 0.5;
      clip.y = 0.5;
      clip.scale = 1;
      clip.rotation = 0;
      clip.flipH = false;
      clip.flipV = false;
      clip.opacity = 1;
      renderInspector();
    }

    // ==========================================
    // MANIPULAÇÃO DIRETA NO CANVAS (MOUSE + TOUCH)
    // ==========================================
    const handleCanvasDragStart = (e) => {
      const rect = canvas.getBoundingClientRect();
      const { clientX, clientY } = getClientCoords(e);
      const clickX = (clientX - rect.left) / rect.width;
      const clickY = (clientY - rect.top) / rect.height;

      const visibleClips = project.clips
        .filter((c) => c.type !== 'audio' && project.currentTime >= c.startTime && project.currentTime <= c.startTime + c.duration)
        .reverse();

      const hit = visibleClips.find((c) => Math.abs(c.x - clickX) < 0.3 && Math.abs(c.y - clickY) < 0.3);
      if (hit) {
        if (e.cancelable) e.preventDefault();
        selectClip(hit.id);
        const startX = clientX;
        const startY = clientY;
        const origX = hit.x;
        const origY = hit.y;

        const onMove = (mv) => {
          if (mv.cancelable) mv.preventDefault();
          const coords = getClientCoords(mv);
          hit.x = origX + (coords.clientX - startX) / rect.width;
          hit.y = origY + (coords.clientY - startY) / rect.height;
        };
        const onUp = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onUp);
          saveState();
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);
      }
    };

    canvas.addEventListener('mousedown', handleCanvasDragStart);
    canvas.addEventListener('touchstart', handleCanvasDragStart, { passive: false });

    // ==========================================
    // MOTOR DE RENDERIZAÇÃO (CANVAS + ÁUDIO FADES)
    // ==========================================
    function renderLoop(timestamp) {
      if (!lastFrameTime) lastFrameTime = timestamp;
      const dt = (timestamp - lastFrameTime) / 1000;
      lastFrameTime = timestamp;

      if (project.isPlaying) {
        project.currentTime += dt;
        if (project.currentTime >= project.duration) {
          project.currentTime = 0;
          togglePlay();
        }
        updatePlayheadUI();
      }

      syncMediaElements();
      drawCanvasFrame();
      requestAnimationFrame(renderLoop);
    }

    function syncMediaElements() {
      project.clips.forEach((clip) => {
        const media = project.mediaLibrary.find((m) => m.id === clip.mediaId);
        if (!media || !media.element) return;
        const el = media.element;
        const active = project.currentTime >= clip.startTime && project.currentTime <= clip.startTime + clip.duration;

        if (active) {
          const localT = project.currentTime - clip.startTime;
          const targetTime = (localT * (clip.speed || 1) + (clip.offset || 0)) % media.duration;

          // Volume dinâmico com Fade In / Fade Out
          let vol = clip.muted ? 0 : (clip.volume ?? 1);
          if (clip.fadeInAudio > 0 && localT < clip.fadeInAudio) vol *= localT / clip.fadeInAudio;
          if (clip.fadeOutAudio > 0 && (clip.duration - localT) < clip.fadeOutAudio) {
            vol *= Math.max(0, (clip.duration - localT) / clip.fadeOutAudio);
          }

          el.volume = Math.max(0, Math.min(1, vol));
          el.playbackRate = clip.speed || 1;

          if (project.isPlaying) {
            if (el.paused) el.play().catch(() => {});
            if (Math.abs(el.currentTime - targetTime) > 0.25) el.currentTime = targetTime;
          } else {
            if (!el.paused) el.pause();
            if (Math.abs(el.currentTime - targetTime) > 0.05) el.currentTime = targetTime;
          }
        } else {
          if (!el.paused) el.pause();
        }
      });
    }

    function drawCanvasFrame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Fundo do Projeto
      if (project.bgMode === 'color') {
        ctx.fillStyle = project.bgColor;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (project.bgMode === 'blur') {
        const mainVid = project.clips.find((c) => c.track === 'video' && project.currentTime >= c.startTime && project.currentTime <= c.startTime + c.duration);
        if (mainVid) {
          const media = project.mediaLibrary.find((m) => m.id === mainVid.mediaId);
          if (media && media.element) {
            ctx.save();
            ctx.filter = 'blur(24px) brightness(65%)';
            ctx.drawImage(media.element, -40, -40, canvas.width + 80, canvas.height + 80);
            ctx.restore();
          }
        }
      }

      ['video', 'overlay'].forEach((trackName) => {
        const activeClips = project.clips.filter(
          (c) => c.track === trackName && project.currentTime >= c.startTime && project.currentTime <= c.startTime + c.duration
        );

        activeClips.forEach((clip) => {
          ctx.save();
          const localTime = project.currentTime - clip.startTime;
          const timeLeft = clip.duration - localTime;
          const interp = getInterpolatedTransform(clip, localTime);

          let animOpacity = interp.opacity ?? 1;
          let animScale = interp.scale ?? 1;
          let animOffsetY = 0;

          // Animação de Entrada
          if (clip.animIn === 'fade' && localTime < 0.45) animOpacity *= localTime / 0.45;
          else if (clip.animIn === 'zoom' && localTime < 0.45) animScale *= 0.65 + 0.35 * (localTime / 0.45);
          else if (clip.animIn === 'slideUp' && localTime < 0.45) animOffsetY = (1 - localTime / 0.45) * 60;

          // Animação de Saída
          if (clip.animOut === 'fade' && timeLeft < 0.45) animOpacity *= Math.max(0, timeLeft / 0.45);
          else if (clip.animOut === 'zoomOut' && timeLeft < 0.45) animScale *= 0.7 + 0.3 * Math.max(0, timeLeft / 0.45);

          ctx.globalCompositeOperation = clip.blendMode || 'source-over';
          ctx.globalAlpha = Math.max(0, Math.min(1, animOpacity));
          ctx.translate(interp.x * canvas.width, interp.y * canvas.height + animOffsetY);
          ctx.rotate(((interp.rotation || 0) * Math.PI) / 180);
          ctx.scale((clip.flipH ? -1 : 1) * animScale, (clip.flipV ? -1 : 1) * animScale);

          if (clip.type === 'video' || clip.type === 'image') {
            const media = project.mediaLibrary.find((m) => m.id === clip.mediaId);
            if (media && media.element) {
              ctx.filter = `brightness(${clip.brightness}%) contrast(${clip.contrast}%) saturate(${clip.saturate}%) hue-rotate(${clip.hue || 0}deg) sepia(${clip.sepia || 0}%) invert(${clip.invert || 0}%) blur(${clip.blur || 0}px)`;
              const w = canvas.width;
              const h = canvas.height;
              if (clip.chromaKey) {
                drawWithChromaKey(media.element, -w / 2, -h / 2, w, h, clip.chromaColor, clip.chromaTolerance);
              } else {
                ctx.drawImage(media.element, -w / 2, -h / 2, w, h);
              }

              // Vinheta
              if (clip.vignette > 0) {
                ctx.filter = 'none';
                const rad = ctx.createRadialGradient(0, 0, w * 0.25, 0, 0, w * 0.65);
                rad.addColorStop(0, 'rgba(0,0,0,0)');
                rad.addColorStop(1, `rgba(0,0,0,${clip.vignette / 100})`);
                ctx.fillStyle = rad;
                ctx.fillRect(-w / 2, -h / 2, w, h);
              }
            }
          } else if (clip.type === 'text') {
            ctx.font = `bold ${clip.fontSize}px "${clip.fontFamily || 'Inter'}", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (clip.shadowBlur > 0) {
              ctx.shadowColor = 'rgba(0,0,0,0.85)';
              ctx.shadowBlur = clip.shadowBlur;
              ctx.shadowOffsetX = 3;
              ctx.shadowOffsetY = 3;
            }

            if (clip.hasBg) {
              const metrics = ctx.measureText(clip.text);
              const padX = 20;
              const padY = 12;
              ctx.fillStyle = clip.bgColor;
              ctx.beginPath();
              ctx.roundRect(-metrics.width / 2 - padX, -clip.fontSize / 2 - padY / 2, metrics.width + padX * 2, clip.fontSize + padY, 8);
              ctx.fill();
            }

            if (clip.strokeWidth > 0) {
              ctx.lineWidth = clip.strokeWidth;
              ctx.strokeStyle = clip.strokeColor || '#000000';
              ctx.strokeText(clip.text, 0, 0);
            }

            ctx.fillStyle = clip.color;
            ctx.fillText(clip.text, 0, 0);
          }

          if (clip.id === project.selectedClipId && !project.isPlaying) {
            ctx.filter = 'none';
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.strokeRect(-140, -45, 280, 90);
          }

          ctx.restore();
        });
      });
    }

    const chromaCanvas = document.createElement('canvas');
    const chromaCtx = chromaCanvas.getContext('2d', { willReadFrequently: true });

    function drawWithChromaKey(source, dx, dy, dw, dh, hexColor, tolerance) {
      chromaCanvas.width = 320;
      chromaCanvas.height = 180;
      chromaCtx.drawImage(source, 0, 0, 320, 180);
      const imgData = chromaCtx.getImageData(0, 0, 320, 180);
      const data = imgData.data;

      const rTarget = parseInt(hexColor.substr(1, 2), 16);
      const gTarget = parseInt(hexColor.substr(3, 2), 16);
      const bTarget = parseInt(hexColor.substr(5, 2), 16);

      for (let i = 0; i < data.length; i += 4) {
        const dist = Math.sqrt((data[i] - rTarget) ** 2 + (data[i + 1] - gTarget) ** 2 + (data[i + 2] - bTarget) ** 2);
        if (dist < tolerance) data[i + 3] = 0;
      }
      chromaCtx.putImageData(imgData, 0, 0);
      ctx.drawImage(chromaCanvas, dx, dy, dw, dh);
    }

    // ==========================================
    // EXPORTAÇÃO MP4 VIA FFMPEG.WASM
    // ==========================================
    function openExportModal() {
      if (project.isPlaying) togglePlay();
      document.getElementById('export-modal').classList.remove('hidden');
      document.getElementById('export-modal').classList.add('flex');
    }

    function closeExportModal() {
      document.getElementById('export-modal').classList.add('hidden');
      document.getElementById('export-modal').classList.remove('flex');
    }

    async function convertWebmToMp4(webmBlob, onProgress) {
      const { FFmpeg } = FFmpegWASM;
      const { fetchFile, toBlobURL } = FFmpegUtil;

      if (!ffmpegInstance) {
        ffmpegInstance = new FFmpeg();
        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
        await ffmpegInstance.load({
          coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
          wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm')
        });
      }

      ffmpegInstance.on('progress', ({ progress }) => {
        if (onProgress) onProgress(Math.round(progress * 100));
      });

      await ffmpegInstance.writeFile('input.webm', await fetchFile(webmBlob));
      await ffmpegInstance.exec(['-i', 'input.webm', '-c:v', 'libx264', '-preset', 'ultrafast', '-pix_fmt', 'yuv420p', 'output.mp4']);
      const data = await ffmpegInstance.readFile('output.mp4');
      return new Blob([data.buffer], { type: 'video/mp4' });
    }

    async function startVideoExport() {
      const fps = parseInt(document.getElementById('export-fps').value);
      const format = document.getElementById('export-format').value;
      const filename = document.getElementById('export-filename').value || 'video_exportado';
      const progressBox = document.getElementById('export-progress-box');
      const bar = document.getElementById('export-bar');
      const pct = document.getElementById('export-pct');
      const stage = document.getElementById('export-stage');

      progressBox.classList.remove('hidden');
      document.getElementById('btn-start-render').disabled = true;
      stage.textContent = 'Gravando quadros...';

      let renderEnd = 3;
      project.clips.forEach((c) => {
        if (c.startTime + c.duration > renderEnd) renderEnd = c.startTime + c.duration;
      });

      const stream = canvas.captureStream(fps);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = async () => {
        const webmBlob = new Blob(chunks, { type: 'video/webm' });
        let finalBlob = webmBlob;
        let finalExt = 'webm';

        if (format === 'mp4') {
          try {
            stage.textContent = 'Convertendo para MP4...';
            bar.style.width = '50%';
            pct.textContent = '50%';
            finalBlob = await convertWebmToMp4(webmBlob, (p) => {
              const totalP = Math.min(99, 50 + Math.round(p / 2));
              bar.style.width = `${totalP}%`;
              pct.textContent = `${totalP}%`;
            });
            finalExt = 'mp4';
          } catch (err) {
            console.warn('Fallback WebM:', err);
          }
        }

        const url = URL.createObjectURL(finalBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${filename}.${finalExt}`;
        a.click();

        progressBox.classList.add('hidden');
        document.getElementById('btn-start-render').disabled = false;
        closeExportModal();
      };

      seekTo(0);
      project.isPlaying = true;
      recorder.start();

      const checkInterval = setInterval(() => {
        const p = Math.min(100, Math.round((project.currentTime / renderEnd) * 100));
        const displayP = format === 'mp4' ? Math.round(p / 2) : p;
        bar.style.width = `${displayP}%`;
        pct.textContent = `${displayP}%`;

        if (project.currentTime >= renderEnd) {
          clearInterval(checkInterval);
          project.isPlaying = false;
          recorder.stop();
          seekTo(0);
        }
      }, 100);
    }

    // ==========================================
    // CONTROLES GERAIS E ATALHOS
    // ==========================================
    function togglePlay() {
      project.isPlaying = !project.isPlaying;
      const btn = document.getElementById('btn-play-pause');
      btn.innerHTML = project.isPlaying
        ? '<i class="fa-solid fa-pause"></i>'
        : '<i class="fa-solid fa-play ml-0.5 text-xs sm:text-sm"></i>';
    }

    function seekTo(time) {
      project.currentTime = Math.max(0, Math.min(project.duration, time));
      updatePlayheadUI();
      syncMediaElements();
    }

    function changeAspectRatio(ratio) {
      project.aspectRatio = ratio;
      if (ratio === '16:9') { canvas.width = 960; canvas.height = 540; }
      else if (ratio === '9:16') { canvas.width = 405; canvas.height = 720; }
      else if (ratio === '4:5') { canvas.width = 540; canvas.height = 675; }
      else { canvas.width = 600; canvas.height = 600; }
      fitCanvasToStage();
    }

    function saveState() {
      const snapshot = JSON.stringify(project.clips);
      project.history = project.history.slice(0, project.historyIndex + 1);
      project.history.push(snapshot);
      project.historyIndex++;
    }

    function undo() {
      if (project.historyIndex > 0) {
        project.historyIndex--;
        project.clips = JSON.parse(project.history[project.historyIndex]);
        renderTimeline();
        renderInspector();
      }
    }

    function redo() {
      if (project.historyIndex < project.history.length - 1) {
        project.historyIndex++;
        project.clips = JSON.parse(project.history[project.historyIndex]);
        renderTimeline();
        renderInspector();
      }
    }

    function formatTime(sec) {
      const mins = Math.floor(sec / 60).toString().padStart(2, '0');
      const secs = Math.floor(sec % 60).toString().padStart(2, '0');
      const ms = Math.floor((sec % 1) * 100).toString().padStart(2, '0');
      return `${mins}:${secs}.${ms}`;
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      if (e.code === 'Delete' || e.code === 'Backspace') deleteSelectedClip();
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); splitSelectedClip(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    });

    init();
  </script>
